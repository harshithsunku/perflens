name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # pytest suite: parser, aggregator (differential vs device fixtures),
  # source mapper, HTTP API (TestClient + live SSE), provisioning against
  # a fake release server, and the C-agent wire protocol (real binary
  # against a fake framing server with a perf shim). Runs without Node —
  # the static-UI test skips when the frontend isn't built.
  # -------------------------------------------------------------------------
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build C agent (needed by the protocol tests)
        run: make -C agent-c

      - name: Install package + test deps
        run: python -m pip install -e '.[dev]'

      # Lint used to live only in build.yml, which has no pull_request
      # trigger — so no PR was ever linted. It runs here, on the workflow
      # that actually gates PRs, and covers tests/ and tools/ as well.
      - name: Lint (ruff)
        run: ruff check src/ tests/ tools/

      # Once, not per-matrix-entry: mypy's findings do not vary across the
      # supported interpreters (python_version is pinned in pyproject), so
      # four runs would just be four copies of the same output.
      - name: Typecheck (mypy)
        if: matrix.python == '3.12'
        run: python -m mypy src/perflens

      # A hand-typed version in the UI once shipped a whole minor ahead of
      # the package it was built into. This asserts every location agrees.
      - name: Version consistency
        run: python tools/check_version.py

      - name: Run pytest
        run: python -m pytest tests/ -v -ra

  # -------------------------------------------------------------------------
  # Frontend: typecheck + vitest unit tests + Playwright browser E2E
  # against a real server replaying a device-captured fixture session
  # (frontend/e2e is self-contained — it starts and stops its own server).
  # Also verifies the committed OpenAPI schema hasn't drifted.
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (vitest + playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install server
        run: python -m pip install -e .

      - name: Install frontend deps
        run: npm --prefix frontend ci

      # `npm run build` only typechecks what ships. The vitest specs, the
      # Playwright e2e spec, the docs-shots harness and playwright.config.ts
      # sat outside every tsconfig project, and both runners transpile without
      # checking — so a type error in exactly the files CI executes shipped
      # silently. tsconfig.test.json covers them; this runs before the
      # five-minute Playwright install so it fails fast.
      - name: Typecheck (tsc)
        run: npm --prefix frontend run typecheck

      - name: OpenAPI schema drift check
        run: |
          python tools/export_openapi.py /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json

      # CONTRIBUTING has long claimed CI diff-checks the generated types.
      # It didn't. The committed schema is the source typegen consumes, so
      # a stale types.gen.ts silently ships wrong types to the bundle.
      - name: TypeScript typegen drift check
        run: |
          npm --prefix frontend run typegen
          git diff --exit-code frontend/src/api/types.gen.ts

      - name: Unit tests (vitest)
        run: npm --prefix frontend run test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run browser E2E (Playwright)
        run: npm --prefix frontend run e2e

      # The docs screenshot harness, exercised but not committed. Its
      # predecessor was a pair of puppeteer scripts that kept reporting
      # success while capturing the wrong page for two months after the
      # React rewrite deleted every global they called. Nothing ran them.
      # This does, on every PR, with no `perf` required — the replay
      # project drives the whole UI from a committed fixture.
      - name: Docs screenshot harness smoke
        run: OUT_DIR="$RUNNER_TEMP/shots" npm --prefix frontend run shots

      # The specs' own assertions catch a broken harness. This catches the
      # subtler failure they can't: tests passing while the images come out
      # blank. Threshold sits below the shot count so one small-but-valid
      # image can't redden the build on its own.
      - name: Assert the harness produced real images
        run: |
          n=$(find "$RUNNER_TEMP/shots" -name '*.png' -size +20k | wc -l)
          echo "usable PNGs: $n"
          [ "$n" -ge 8 ] || { echo "docs harness produced only $n usable PNGs"; exit 1; }

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
