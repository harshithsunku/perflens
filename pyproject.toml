[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perflens"
version = "0.9.0"
description = "Real-time remote Linux performance profiler with a live web UI (perf + flame graphs + line-level source annotation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Harshith Sunku" }]
keywords = ["perf", "profiler", "flamegraph", "linux", "performance",
            "profiling", "embedded", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
# Upper bounds are deliberate. Floors alone let a future major (fastapi 1.0,
# pydantic 3) resolve into a fresh `uvx perflens` and break it with no change
# on our side, which defeats a long-term release. The bounds document what is
# actually tested rather than restricting it. Cost: when fastapi 1.0 ships,
# installs pin to the last 0.x until we cut a release — revisit then.
# starlette and pydantic are left alone on purpose; fastapi pins them
# transitively, and a second constraint here only creates resolver conflicts.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "orjson>=3.9,<4",
    "zstandard>=0.21,<1.0",
]

[project.optional-dependencies]
# The MCP server is opt-in: `uvx perflens` stays a four-dependency install
# for everyone who just wants the web UI.
mcp = ["mcp>=2,<3", "httpx>=0.27,<1.0"]
# ruff is pinned exactly: it is the one tool where a minor bump lands new
# rules and reddens an unrelated PR. Keep in step with build.yml.
dev = ["pytest>=7", "httpx>=0.27,<1.0", "build", "ruff==0.15.22", "mcp>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # test_parser_compat / test_aggregator_diff are dual-mode (plain
    # `python tests/test_x.py` still works); their test functions return
    # values for the standalone runner.
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[project.scripts]
perflens = "perflens.cli:main"

[project.urls]
Homepage = "https://github.com/harshithsunku/perflens"
Documentation = "https://harshithsunku.github.io/perflens/"
Repository = "https://github.com/harshithsunku/perflens"
Issues = "https://github.com/harshithsunku/perflens/issues"
Changelog = "https://github.com/harshithsunku/perflens/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/perflens"]
# Ship the web UI inside the wheel (served via importlib.resources)
artifacts = ["src/perflens/ui/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/perflens",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
# The built UI is gitignored (Vite output) but must ship in the sdist so
# `pip install perflens-x.tar.gz` serves the web UI without Node.
artifacts = ["src/perflens/ui/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
