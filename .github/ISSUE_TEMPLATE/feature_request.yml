name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What are you trying to do that PerfLens makes hard today? Describe the
        situation rather than the solution — it usually leads somewhere better.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. A sketch is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds, other tools, or the manual steps this replaces.
